; RF Sentinel EU for M5StickC / M5StickC Plus (ESP32-PICO-D4).
; M5Unified detects which of the two it is running on at boot.
[env:m5stick]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
; the FTDI bridge on the original StickC refuses faster rates
upload_speed = 115200
lib_deps =
    m5stack/M5Unified@0.3.0
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
